# Gerado pelo plugin Web Filter do HWMDM. Nao edite: o arquivo e regenerado a cada alteracao.
upstreams:
  groups:
    default:
      - tcp-tls:1.1.1.1:853
      - tcp-tls:8.8.8.8:853
  strategy: parallel_best
ports:
  dns: 0.0.0.0:53
  tls: 853
  http: 127.0.0.1:4000
certFile: /app/certs/cert.pem
keyFile: /app/certs/key.pem
log:
  level: info
queryLog:
  type: csv
  target: /app/queries
  logRetentionDays: 0
blocking:
  blockType: nxDomain
  blockTTL: 1m
  loading:
    refreshPeriod: 0m
    strategy: failOnError
  denylists:
    cat-doh:
      - /app/lists/doh.txt
    p-default:
      - /app/dns/profiles/default-deny.txt
  allowlists:
    p-default:
      - /app/dns/profiles/default-allow.txt
  clientGroupsBlock:
    default:
      - p-default
      - cat-doh
