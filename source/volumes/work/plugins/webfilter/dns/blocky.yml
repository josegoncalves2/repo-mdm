# Gerado pelo plugin Web Filter do HWMDM. Nao edite: o arquivo e regenerado a cada alteracao.
upstreams:
  groups:
    default:
      - tcp-tls:1.1.1.1:853
      - tcp-tls:8.8.8.8:853
  strategy: parallel_best
ports:
  dns: 127.0.0.1:53
  tls: 853
  http: 127.0.0.1:4000
certFile: /app/certs/cert.pem
keyFile: /app/certs/key.pem
log:
  level: info
queryLog:
  type: none
blocking:
  blockType: nxDomain
  blockTTL: 1m
  loading:
    refreshPeriod: 0m
    strategy: failOnError
  denylists:
    p-c1-p1:
      - /app/dns/profiles/c1-p1-deny.txt
    p-c1-p11:
      - /app/dns/profiles/c1-p11-deny.txt
    cat-adult:
      - /app/lists/adult.txt
    cat-dating:
      - /app/lists/dating.txt
    cat-doh:
      - /app/lists/doh.txt
    cat-drugs:
      - /app/lists/drugs.txt
    cat-gambling:
      - /app/lists/gambling.txt
    cat-games:
      - /app/lists/games.txt
    cat-malware:
      - /app/lists/malware.txt
    cat-phishing:
      - /app/lists/phishing.txt
    cat-piracy:
      - /app/lists/piracy.txt
    cat-shopping:
      - /app/lists/shopping.txt
    cat-social_media:
      - /app/lists/social_media.txt
    cat-streaming:
      - /app/lists/streaming.txt
    cat-violence:
      - /app/lists/violence.txt
    cat-vpn_proxy:
      - /app/lists/vpn_proxy.txt
  allowlists:
    p-c1-p1:
      - /app/dns/profiles/c1-p1-allow.txt
    p-c1-p11:
      - /app/dns/profiles/c1-p11-allow.txt
  clientGroupsBlock:
    c1-p1:
      - p-c1-p1
      - cat-doh
      - cat-games
      - cat-social_media
    c1-p11:
      - p-c1-p11
      - cat-adult
      - cat-dating
      - cat-doh
      - cat-drugs
      - cat-gambling
      - cat-games
      - cat-malware
      - cat-phishing
      - cat-piracy
      - cat-shopping
      - cat-social_media
      - cat-streaming
      - cat-violence
      - cat-vpn_proxy
