<!-- Localization completed -->
<div class="hwmdm-list-page" ng-controller="UsersTabController">
    <div class="hwmdm-page-toolbar">
        <div>
            <h3 localized>nav.users</h3>
            <p localized>users.page.subtitle</p>
        </div>
        <div class="hwmdm-search-actions">
            <div class="btn-group" role="group">
                <button type="button" class="btn btn-default"
                        ng-class="{active: viewMode === 'cards'}"
                        localized-title="files.view.cards"
                        ng-click="viewMode = 'cards'">
                    <span class="glyphicon glyphicon-th-large"></span>
                    <span localized>files.view.cards</span>
                </button>
                <button type="button" class="btn btn-default"
                        ng-class="{active: viewMode === 'list'}"
                        localized-title="files.view.list"
                        ng-click="viewMode = 'list'">
                    <span class="glyphicon glyphicon-list"></span>
                    <span localized>files.view.list</span>
                </button>
            </div>
            <input type='text' ng-model='search.searchValue' ng-enter='search()'
                   localized-placeholder='form.settings.users.search.placeholder'
                   class='form-control'>
            <button type='button' class='btn btn-primary' ng-click='editUser( {} )'>
                <span class="glyphicon glyphicon-plus"></span>&nbsp;<span localized>button.add</span>
            </button>
        </div>
    </div>

    <div class="text-center" ng-if="users.length > paging.pageSize">
        <pagination
                boundary-links='true' class='pagination-sm'
                max-size='3'
                ng-model='paging.currentPage'
                total-items='users.length'
                items-per-page='paging.pageSize'
                previous-text='&lsaquo;' next-text='&rsaquo;' first-text='&laquo;'
                last-text='&raquo;'></pagination>
    </div>

    <div ng-if='users && users.length > 0 && viewMode === "cards"' class="config-card-grid">
        <div class="config-card"
             ng-repeat="user in users.slice(((paging.currentPage-1)*paging.pageSize), ((paging.currentPage)*paging.pageSize))">
            <div class="config-card-body" ng-click="editUser(user)">
                <div class="config-card-name">{{user.name || user.login}}</div>
                <div class="config-card-desc">{{user.login}}</div>
                <div class="app-card-meta">
                    <span class="app-card-badge">{{user.userRole.name}}</span>
                </div>
            </div>
            <div class="config-card-actions">
                <button type='button' class='btn btn-sm btn-default' localized-title="button.edit" ng-click='editUser(user)'>
                    <span class='glyphicon glyphicon-pencil'></span>
                </button>
                <button type='button' ng-if="user.editable && !user.superAdmin"
                        class='btn btn-sm btn-default' localized-title="button.login"
                        ng-click='loginAs(user)'>
                    <span class='glyphicon glyphicon-copy'></span>
                </button>
                <button type='button' ng-if="user.editable && !user.superAdmin"
                        class='btn btn-sm btn-default' localized-title="button.delete"
                        ng-disabled='group.id === 1'
                        ng-click='removeUser(user)'>
                    <span class='glyphicon glyphicon-trash'></span>
                </button>
            </div>
        </div>
    </div>

    <div ng-if='users && users.length > 0 && viewMode === "list"' class="table-responsive">
        <table class='table'>
            <thead>
            <tr>
                <th localized>form.settings.users.login</th>
                <th localized>form.settings.users.name</th>
                <th localized>form.settings.users.role</th>
                <th class='actions-column' localized>table.heading.configuration.actions</th>
            </tr>
            </thead>
            <tbody>
            <tr ng-repeat='user in users.slice(((paging.currentPage-1)*paging.pageSize), ((paging.currentPage)*paging.pageSize))'>
                <td><a class="action-link" ng-click="editUser(user)">{{user.login}}</a></td>
                <td>{{user.name || '—'}}</td>
                <td><span class="app-card-badge">{{user.userRole.name}}</span></td>
                <td>
                    <div><nobr>
                        <button type='button' class='btn btn-default' localized-title="button.edit" ng-click='editUser(user)'>
                            <span class='glyphicon glyphicon-pencil'></span>
                        </button>
                        <button type='button' ng-if="user.editable && !user.superAdmin"
                                class='btn btn-default' localized-title="button.login" ng-click='loginAs(user)'>
                            <span class='glyphicon glyphicon-copy'></span>
                        </button>
                        <button type='button' ng-if="user.editable && !user.superAdmin"
                                class='btn btn-default' localized-title="button.delete" ng-click='removeUser(user)'>
                            <span class='glyphicon glyphicon-trash'></span>
                        </button>
                    </nobr></div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div ng-if='users && users.length === 0' class='hwmdm-empty-state'>
        <span class="glyphicon glyphicon-user"></span>
        <span localized>notfound.users</span>
    </div>

    <div class="text-center" ng-if="users.length > paging.pageSize">
        <pagination
                boundary-links='true' class='pagination-sm'
                max-size='3'
                ng-model='paging.currentPage'
                total-items='users.length'
                items-per-page='paging.pageSize'
                previous-text='&lsaquo;' next-text='&rsaquo;' first-text='&laquo;'
                last-text='&raquo;'></pagination>
    </div>
</div>
