<!-- Localization completed -->
<div class="hwmdm-list-page" ng-controller="ProfileController">
    <div class="hwmdm-page-toolbar">
        <div>
            <h3 localized>menu.profile</h3>
        </div>
    </div>

    <div ng-show='errorMessage' class='alert alert-danger'>{{errorMessage}}</div>
    <div ng-show='completeMessage' class='alert alert-success'>{{completeMessage}}</div>

    <div class="row">
        <div class="col-md-6">
            <div class="panel panel-default">
                <div class="panel-heading"><h4 class="panel-title" localized>menu.profile</h4></div>
                <div class="panel-body">
                    <form class="form-horizontal">
                        <div class='form-group'>
                            <label for='login' class='col-sm-4 control-label' localized>form.user.login</label>
                            <div class='col-sm-8'>
                                <input ng-model='user.login' type='text' class='form-control' id='login' disabled>
                            </div>
                        </div>

                        <div class='form-group' ng-if="settings.accountType != 3 && !settings.singleCustomer">
                            <label class="col-sm-4 control-label" localized>form.customer.type</label>
                            <div class="col-sm-8">
                                <p class="form-control-static">{{accountType(settings.accountType)}}</p>
                            </div>
                        </div>

                        <div class='form-group' ng-if="settings.expiryTime > 0">
                            <label class="col-sm-4 control-label" localized>form.customer.expiry.time</label>
                            <div class="col-sm-8">
                                <p class="form-control-static">
                                    <span ng-class="{'warning-font': settings.expiryTime && settings.expiryTime < now + 86400000*3}">{{settings.expiryTime | date:'dd/MM/yyyy'}}</span>
                                </p>
                            </div>
                        </div>

                        <div class='form-group' ng-if="settings.deviceLimit > 0">
                            <label class="col-sm-4 control-label" localized>form.customer.device.limit</label>
                            <div class="col-sm-8">
                                <p class="form-control-static">
                                    <span ng-class="{'warning-font': settings.deviceCount > settings.deviceLimit}">{{settings.deviceCount}} / {{settings.deviceLimit}}</span>
                                </p>
                            </div>
                        </div>

                        <div class='form-group' ng-if="settings.sizeLimit > 0">
                            <label class="col-sm-4 control-label" localized>form.customer.size.limit</label>
                            <div class="col-sm-8">
                                <p class="form-control-static">{{sizeLimit}} Mb</p>
                            </div>
                        </div>

                        <div class='form-group'>
                            <label for='username' class='col-sm-4 control-label' localized>form.user.name</label>
                            <div class='col-sm-8'>
                                <input ng-model='user.name' type='text' class='form-control' id='username'
                                       localized-placeholder='form.user.name.placeholder'>
                            </div>
                        </div>

                        <div class='form-group'>
                            <label for='email' class='col-sm-4 control-label' localized>form.user.email</label>
                            <div class='col-sm-8'>
                                <input ng-model='user.email' type='text' class='form-control' id='email'
                                       localized-placeholder='form.user.email.placeholder'>
                            </div>
                        </div>

                        <div class='form-group'>
                            <div class='col-sm-offset-4 col-sm-8'>
                                <button type='submit' class='btn btn-primary' ng-disabled="!saveEnabled" ng-click='saveDetails()' localized>button.save</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="panel panel-default">
                <div class="panel-heading"><h4 class="panel-title" localized>form.profile.title</h4></div>
                <div class="panel-body">
                    <form class="form-horizontal">
                        <div class='form-group'>
                            <label for='oldPassword' class='col-sm-4 control-label' localized>form.profile.password.old</label>
                            <div class='col-sm-8'>
                                <input ng-model='user.oldPassword' type='password' class='form-control' id='oldPassword'
                                       localized-placeholder='form.profile.password.old.placeholder'>
                            </div>
                        </div>

                        <div class='form-group'>
                            <label for='newPassword' class='col-sm-4 control-label' localized>form.profile.password.new</label>
                            <div class='col-sm-8'>
                                <input ng-model='user.newPassword' type='password' class='form-control' id='newPassword'
                                       localized-placeholder='form.profile.password.new.placeholder'>
                            </div>
                        </div>

                        <div class='form-group'>
                            <label for='confirm' class='col-sm-4 control-label' localized>form.profile.password.confirm</label>
                            <div class='col-sm-8'>
                                <input ng-model='user.confirm' type='password' class='form-control' id='confirm'
                                       localized-placeholder='form.profile.password.confirm.placeholder'>
                                <p class="help-block">{{qualityMessage}}</p>
                            </div>
                        </div>

                        <div class='form-group'>
                            <div class='col-sm-offset-4 col-sm-8'>
                                <button type='submit' class='btn btn-primary' ng-disabled="!saveEnabled" ng-click='saveProfile()' localized>button.save</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
