<!-- Modal: QR Code de Matricula -->
<div class="modal-header">
    <h4 class="modal-title" localized>form.qr.title</h4>
</div>
<div class="modal-body">
    <div class="row">
        <div class="col-sm-7">
            <div class="form-group">
                <label localized>form.qr.device.number</label>
                <input type="text" maxlength="100" name="qrdevice"
                       ng-enter="renew()"
                       ng-change="renew()"
                       ng-model="formData.deviceIdNew"
                       localized-placeholder="form.qr.device.number.placeholder"
                       class="form-control" />
            </div>

            <div class="form-group">
                <label localized>form.qr.number.use</label>
                <select class="form-control" ng-change="renew()"
                        ng-model="formData.useId" ng-disabled="formData.deviceIdNew != ''">
                    <option ng-value="''" ng-selected="!formData.useId && formData.deviceIdNew == ''" localized>form.qr.number.use.request</option>
                    <option ng-value="'imei'" ng-selected="formData.useId === 'imei'" localized>form.qr.number.use.imei</option>
                    <option ng-value="'serial'" ng-selected="formData.useId === 'serial'" localized>form.qr.number.use.serial</option>
                </select>
                <p class="help-block" localized>form.qr.number.hint</p>
            </div>

            <div class="checkbox">
                <label>
                    <input type="checkbox" ng-model="formData.create" ng-change="renew()" />
                    <span localized>form.qr.auto.create</span>
                </label>
            </div>

            <div class="form-group" ng-if="formData.create">
                <label localized>form.qr.groups</label>
                <div ng-dropdown-multiselect
                     options="groupsList"
                     translation-texts="tableFilteringTexts"
                     selected-model="groupsSelection"
                     events="groupsSelectionEvents"
                     ng-change="renew()"
                     class="custom-multi-select"></div>
            </div>

            <div style="margin-top:12px;display:flex;gap:8px">
                <button type="button" class="btn btn-default btn-sm" ng-click="generateJson()">
                    <span class="glyphicon glyphicon-list"></span> <span localized>form.qr.button.json</span>
                </button>
                <button type="button" class="btn btn-default btn-sm" ng-click="helpClicked()">
                    <span class="glyphicon glyphicon-question-sign"></span> <span localized>button.help</span>
                </button>
            </div>

            <div ng-if="jsonData" style="margin-top:12px">
                <label>JSON</label>
                <textarea class="form-control" style="height:100px;font-family:monospace;font-size:12px" readonly>{{jsonData}}</textarea>
            </div>

            <div ng-if="showHelp" style="margin-top:12px;padding:12px;background:#f8f9fa;border-radius:4px">
                <p localized>qrcode.help.line1</p>
                <ol style="margin:8px 0;padding-left:20px;line-height:1.7">
                    <li localized>qrcode.help.line2</li>
                    <li localized>qrcode.help.line3</li>
                    <li localized>qrcode.help.line4</li>
                </ol>
                <p>{{qrCodeHelpLine5}}</p>
            </div>
        </div>

        <div class="col-sm-5" ng-if="showQR">
            <div style="text-align:center;padding:16px 0">
                <div style="background:#fff;border:1px solid #d9e2ec;border-radius:8px;padding:16px;display:inline-block">
                    <img ng-src="{{qrCodeUrl}}" width="{{size}}" height="{{size}}"
                         localized-alt="form.qr.code.image.alt"
                         style="display:block;border-radius:4px;max-width:100%;height:auto"/>
                </div>
                <p style="margin:12px 0 0;color:#64748b;font-size:13px" localized>form.qr.scan.instruction</p>
            </div>
        </div>
    </div>
</div>
<div class="modal-footer">
    <button type="button" class="btn btn-default" ng-click="closeModal()" localized>button.close</button>
</div>
