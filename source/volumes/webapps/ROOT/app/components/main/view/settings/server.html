<!-- Gestao do servidor: o hwmdm-admin, container proprio da stack, aberto dentro do painel.
     Fica fora do Tomcat de proposito: reinicia/recria os containers sem derrubar a si mesmo.
     Layout padrao hwmdm-section-page para seguir o resto da interface. -->
<div class="hwmdm-section-page" ng-controller="ShellController">
    <div class="hwmdm-page-toolbar">
        <div>
            <h3 localized>nav.server</h3>
            <p localized>server.page.subtitle</p>
        </div>
    </div>
    <div class="hwmdm-section-card" style="padding:0;overflow:hidden;border:0">
        <iframe ng-src="{{serverAdminUrl}}" title="Servidor" data-testid="server-admin-frame"
                style="width:100%;height:calc(100vh - 180px);min-height:520px;border:0;display:block"></iframe>
    </div>
</div>
