<!-- Localization completed -->
<div ng-controller="ConfigurationsTabController" class="hwmdm-list-page">

    <notification-message attr-name="configurationsMessage"></notification-message>

    <div class="hwmdm-page-toolbar">
        <div>
            <h3 localized>nav.configurations</h3>
            <p localized>configurations.page.subtitle</p>
        </div>
        <div class="hwmdm-search-actions">
            <input type='text'
                   ng-enter='search()'
                   ng-model='searchObj.searchValue'
                   ng-change="search()"
                   localized-placeholder='search.placeholder.configuration'
                   class='form-control'>
            <button type='button' class='btn btn-primary' ng-if="hasPermission('add_config')" ng-click='addConfiguration()'>
                <span class="glyphicon glyphicon-plus"></span>&nbsp;<span localized>button.add</span>
            </button>
        </div>
    </div>

    <div class="text-center" ng-if="configurations.length > paging.pageSize">
        <pagination
                boundary-links='true' class='pagination-sm'
                max-size='3'
                ng-model='paging.currentPage'
                total-items='configurations.length'
                items-per-page='paging.pageSize'
                previous-text='&lsaquo;' next-text='&rsaquo;' first-text='&laquo;'
                last-text='&raquo;'></pagination>
    </div>

    <div ng-if='configurations && configurations.length > 0' class="config-card-grid">
        <div class="config-card"
             ng-repeat="configuration in configurations.slice(((paging.currentPage-1)*paging.pageSize), ((paging.currentPage)*paging.pageSize))">
            <div class="config-card-body" ng-click="editConfiguration(configuration)">
                <div class="config-card-name">{{configuration.name}}</div>
                <div class="config-card-desc" ng-if="configuration.description">{{configuration.description}}</div>
                <div class="config-card-desc" ng-if="!configuration.description" style="font-style:italic" localized>configurations.no.description</div>
            </div>
            <div class="config-card-actions">
                <button type='button' class='btn btn-sm btn-default' localized-title="button.change"
                        ng-click='editConfiguration(configuration)'>
                    <span class='glyphicon glyphicon-pencil'></span>
                </button>
                <button ng-disabled='configuration.id === 1'
                        type='button' localized-title="button.delete"
                        class='btn btn-sm btn-default'
                        ng-if="hasPermission('copy_config')"
                        ng-click='removeConfiguration(configuration)'>
                    <span class='glyphicon glyphicon-trash'></span>
                </button>
                <button type='button' class='btn btn-sm btn-default' localized-title="button.copy"
                        ng-if="hasPermission('copy_config')"
                        ng-click='copyConfiguration(configuration)'>
                    <span class='glyphicon glyphicon-duplicate'></span>
                </button>
                <button type='button' class='btn btn-sm btn-default' localized-title="button.qrcode"
                        data-hint-key="hint.step.2"
                        ng-if="qrCodeAvailable(configuration)"
                        ng-click='showQrCode(configuration)'>
                    <span class='glyphicon glyphicon-qrcode'></span>
                </button>
            </div>
        </div>
    </div>

    <div ng-if='configurations && configurations.length == 0' class='hwmdm-empty-state'>
        <span class="glyphicon glyphicon-cog"></span>
        <span localized>notfound.configurations</span>
    </div>

    <div class="text-center" ng-if="configurations.length > paging.pageSize">
        <pagination
                boundary-links='true' class='pagination-sm'
                max-size='3'
                ng-model='paging.currentPage'
                total-items='configurations.length'
                items-per-page='paging.pageSize'
                previous-text='&lsaquo;' next-text='&rsaquo;' first-text='&laquo;'
                last-text='&raquo;'></pagination>
    </div>

</div>
