<!-- Localization completed -->
<div class='modal-body'>
    <form class='form-horizontal'>

        <div class="text-center">
            <h4>{{line1Text}}</h4>
        </div>

        <div class="text-center">
            <h4 localized>about.line.2</h4>
        </div>

        <div class="text-center">
            <h4>{{line3Text}}</h4>
        </div>

        <div ng-if="plugins" class="text-center margin-top-40">
            <div>
                <div><h4 localized>about.line.4</h4></div>

                <!--<div class="form-group" ng-repeat="plugin in plugins">{{plugin}}</div> -->
                <div class="form-group" style="margin: 15px">{{pluginList}}</div>
            </div>
        </div>

        <div class="hwmdm-version-about margin-top-40" ng-if="hwmdmInfo">
            <hr>
            <div class="text-center">
                <h4>HWMDM {{hwmdmInfo.versao}}</h4>
                <div class="hwmdm-version-about__linha">
                    {{hwmdmInfo.ref}} &middot; commit {{hwmdmInfo.commit}} &middot; {{hwmdmInfo.data_commit_utc}}
                </div>
                <div class="hwmdm-version-about__linha" ng-repeat="(pkg, a) in hwmdmInfo.agentes">
                    {{a.nome}} {{a.versao}}
                </div>
            </div>
        </div>
        <div class="hwmdm-version-about margin-top-40 text-center" ng-if="!hwmdmInfo">
            <hr>
            <span class="hwmdm-version-about__indisponivel">vers&atilde;o da plataforma indispon&iacute;vel</span>
        </div>

        <div class='form-group margin-top-40'>
            <div class="text-center">
                <button type='button' class='btn btn-default' ng-click='closeModal()' localized >button.close</button>
            </div>
        </div>
    </form>
</div>
