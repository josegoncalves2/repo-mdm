<!doctype html>
<html><head><meta charset="utf-8"><title>remote access proof</title>
<style>html,body,iframe{margin:0;padding:0;border:0;width:100vw;height:100vh;overflow:hidden}</style>
</head>
<body>
<iframe id="f"></iframe>
<script>
(async function () {
  var r = await fetch('/rest/public/auth/login', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({login: 'admin', password: '21232F297A57A5A743894A0E4A801FC3'})
  });
  var j = await r.json();
  if (j.status !== 'OK') {
    document.body.textContent = 'login FAIL: ' + JSON.stringify(j);
    return;
  }
  document.cookie = 'user=' + encodeURIComponent(JSON.stringify(j.data)) + '; path=/';
  try { localStorage.setItem('hwmdm.user', JSON.stringify(j.data)); } catch (e) {}
  document.getElementById('f').src = '/#/remoteAccess';
  // Mantem a navegacao principal "pendente" para o chromium nao capturar antes do SPA
  // dentro do iframe terminar de montar.
  await new Promise(function (resolve) { setTimeout(resolve, 8000); });
})();
</script>
</body></html>
