# Sobe com `docker compose up -d` num clone recem-feito, sem nenhum passo previo.
#
# Todo ${VAR} tem valor padrao para desenvolvimento local, entao a ausencia de
# source/.env (que e' gitignored, porque carrega senha e segredo reais) nao impede
# a subida. Quando o .env existe, o compose o le automaticamente e os valores dele
# vencem estes padroes -- o fluxo do scripts/provision.sh continua igual.
#
# name: fixa o nome do projeto Compose. Sem isto, o Compose usa o nome da PASTA
# ("source") como nome do projeto -- e como TODO clone deste repo tem uma pasta
# "source" identica, um `docker compose up` num segundo clone na MESMA maquina
# reconhece os containers do primeiro como se fossem dele e os RECRIA, derrubando
# o que estava rodando. Ja aconteceu em producao. Se for subir mais de uma
# instancia no mesmo host, rode com um nome proprio:
#     COMPOSE_PROJECT_NAME=outro-nome docker compose up -d
name: ${COMPOSE_PROJECT_NAME:-hwmdm}
services:

  postgresql:
    image: postgres:12-alpine
    ports:
      - 5432:5432
    environment:
      # Sem TZ o container roda em UTC e todos os timestamps do banco/logs ficam
      # 3h adiantados em relacao ao horario local (America/Sao_Paulo).
      TZ: America/Sao_Paulo
      POSTGRES_USER: ${SQL_USER:-hmdm}
      POSTGRES_PASSWORD: ${SQL_PASS:-hmdm}
      POSTGRES_DB: ${SQL_BASE:-hmdm}
    volumes:
      - postgresql-data:/var/lib/postgresql/data
      # O Postgres executa o que estiver aqui na PRIMEIRA inicializacao do cluster,
      # e aceita .sql.gz nativamente. Sem isto o banco sobe vazio, sem usuario
      # nenhum, e nao ha como entrar no painel. O provision.sh restaura o mesmo
      # dump quando ja existe banco; os dois caminhos levam ao mesmo lugar.
      - ./sql/hmdm-dump.sql.gz:/docker-entrypoint-initdb.d/10-hmdm-dump.sql.gz:ro

  hmdm:
    image: headwindmdm/hmdm:0.1.8
    ports:
      - 8080:8080
      - 31000:31000
    volumes:
      - ./docker-entrypoint.sh:/docker-entrypoint.sh:ro
      - ../server-source/server/src/main/webapp:/opt/custom-webapp:ro
      - ./tomcat_conf/server.xml:/usr/local/tomcat/conf/server.xml:ro
      # Os templates do repositorio, e nao os que vieram dentro da imagem. Com
      # FORCE_RECONFIGURE=true o entrypoint regenera o ROOT.xml a cada subida a partir
      # daqui; sem este mount ele usava o template da imagem, onde proxy.addresses vem
      # comentado -- e toda edicao manual do ROOT.xml era desfeita no restart seguinte,
      # deixando o painel mostrando o IP do proxy no lugar do IP de cada aparelho.
      - ./templates:/opt/hmdm/templates:ro
      - ./volumes/work:/usr/local/tomcat/work
      - ./volumes/hmdm-config:/usr/local/tomcat/conf/Catalina/localhost
      - ./volumes/webapps:/usr/local/tomcat/webapps
      # BackupResource grava/le dumps aqui. Fora do container de proposito -- um backup
      # que so existe dentro do proprio container que ele deveria proteger nao serve
      # de nada quando esse container e' o que precisa ser restaurado.
      - ./volumes/backups:/opt/hmdm/backups
      # A WAR versionada entra direto no cache que o docker-entrypoint.sh procura.
      # Sem isto um clone novo morre com "HMDM_URL nao configurado e nenhum WAR
      # encontrado", porque quem copiava dist/hmdm.war para ca era o provision.sh.
      - ../dist/hmdm.war:/usr/local/tomcat/work/cache/hmdm-5.39.2-os.war:ro
    environment:
      # Fuso local: sem isto o Tomcat/JVM roda em UTC e loga 3h adiantado.
      TZ: America/Sao_Paulo
      # catalina.sh usa 0027 por padrao quando UMASK nao esta definido -- isso faz todo
      # arquivo que o Tomcat cria (logo, cor de fundo, apk, qualquer upload) nascer 640,
      # dono root:root (o processo roda como root dentro do container, sem userns-remap).
      # Root le/escreve esses arquivos de qualquer forma, entao o app nunca vê erro; quem
      # apanha e' tudo que roda FORA do container com o usuario do host (sahwmdm): backup,
      # inspecao manual, qualquer script em scripts/. 0022 mantem dono root mas deixa os
      # arquivos world-readable (644 em vez de 640), sem abrir escrita para ninguem alem
      # do dono.
      UMASK: "0022"
      SQL_HOST: postgresql
      SQL_USER: ${SQL_USER:-hmdm}
      SQL_BASE: ${SQL_BASE:-hmdm}
      SQL_PASS: ${SQL_PASS:-hmdm}
      BASE_DOMAIN: ${BASE_DOMAIN:-localhost}
      LOCAL_IP: ${LOCAL_IP:-}
      PROXY_ADDRESSES: ${PROXY_ADDRESSES:-}
      PROTOCOL: ${PROTOCOL:-http}
      PUBLIC_PROTOCOL: ${PUBLIC_PROTOCOL:-http}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@localhost}
      SHARED_SECRET: ${SHARED_SECRET:-hwmdm-local-dev}
      HMDM_VARIANT: ${HMDM_VARIANT:-os}
      DOWNLOAD_CREDENTIALS: ${DOWNLOAD_CREDENTIALS:-}
      HMDM_URL: ${HMDM_URL:-}
      CLIENT_VERSION: ${CLIENT_VERSION:-6.36}
      FORCE_RECONFIGURE: ${FORCE_RECONFIGURE:-true}
      APPLY_CUSTOM_WEBAPP_ON_BOOT: "true"
      AUTO_UPDATE_WEBAPP: "false"

volumes:
  postgresql-data:
