# Resolvedor do Web Filter. Separado do compose do MDM de proposito (design D8): o MDM so escreve
# arquivos em source/volumes/work/plugins/webfilter/dns e nao tem acesso a este container.
#   docker compose -f webfilter-dns/docker-compose.yaml up -d --build
# Certificado: WEBFILTER_CERTS_DIR deve conter cert.pem e key.pem validos para *.<dominio DNS do filtro>.
name: hwmdm-webfilter
services:
  webfilter-dns:
    build: .
    image: hwmdm/webfilter-dns:0.34.0
    container_name: webfilter-dns
    restart: unless-stopped
    ports:
      - "853:853/tcp"          # DoT (DNS privado do Android)
      # DNS comum: e' o que o operador digita no Wi-Fi do tablet. Preso a um endereco de rede
      # de proposito -- o systemd-resolved deste host ja ocupa 127.0.0.53:53 e 127.0.0.54:53,
      # e publicar em 0.0.0.0:53 colide com eles e derruba o "compose up" inteiro.
      - "${WEBFILTER_BIND_ADDR:-192.168.1.65}:53:53/udp"
      - "${WEBFILTER_BIND_ADDR:-192.168.1.65}:53:53/tcp"
    volumes:
      - ../source/volumes/work/plugins/webfilter/dns:/app/dns:ro
      - ${WEBFILTER_CERTS_DIR:-./certs}:/app/certs:ro
      - webfilter-lists:/app/lists
      - webfilter-state:/app/state
    environment:
      TZ: America/Sao_Paulo
    healthcheck:
      test: ["CMD", "python3", "-c", "import sys; sys.path.insert(0, '/app'); import resolver; sys.exit(0 if resolver.dns_ok() else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s
    mem_limit: 1536m
volumes:
  webfilter-lists:
  webfilter-state:
