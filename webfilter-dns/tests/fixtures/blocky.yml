dns:
  port: 53
  tcpPort: 53
  tls:
    port: 853
    certFile: /app/certs/cert.pem
    keyFile: /app/certs/key.pem
  bootstrap:
    - 8.8.8.8:53
    - 8.8.4.4:53

http:
  port: 4000

upstream:
  default:
    - https://dns.google/dns-query
    - https://dns.quad9.net/dns-query

customDNS:
  customTTL: 3600

blocking:
  denylists:
    ads:
      - /app/dns/lists/ads.txt
    malware:
      - /app/dns/lists/malware.txt
  allowlists:
    whitelist:
      - /app/dns/lists/whitelist.txt
  clientGroupsBlock:
    default:
      - ads
      - malware
    profile1:
      - ads
    profile2:
      - malware

caching:
  prefetching: true
  minTime: 5m
  maxTime: 30m
  maxItemsCount: 0

log:
  level: info
  format: text
