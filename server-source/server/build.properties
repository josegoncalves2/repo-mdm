# Arquivo exigido pelo maven-resources-plugin (fase validate) para filtrar
# server/conf/context.xml -> server/target/context.xml. Sem ele o build falha com
# "Error loading property file 'build.properties'".
#
# ATENCAO: estes valores NAO chegam em producao. O deploy Docker deste projeto usa
# source/volumes/hmdm-config/ROOT.xml, bind-montado em
# /usr/local/tomcat/conf/Catalina/localhost/ e gerado a partir do source/.env.
# O target/context.xml produzido aqui e' descartado. Nao coloque segredo real neste
# arquivo: mude o .env.

# database settings
jdbc.url=jdbc:postgresql://postgresql:5432/hmdm
jdbc.driver=org.postgresql.Driver
jdbc.username=hmdm
jdbc.password=CHANGE_ME_NAO_USADO

# A path to a base app directory to store internal data
base.directory=/usr/local/tomcat/work

# A path to a directory to store uploaded files
files.directory=/usr/local/tomcat/work/files

# A base URL for deployment of this build
base.url=http://localhost:8080

# A usage scenario:
# shared: the application hosts data for multiple customers
# private: the application hosts the data just for a single customer
usage.scenario=private

# If set to 1, the device configuration request must be signed by a shared secret
secure.enrollment=0

# A hash secret used for validating the device IDs provided by requests from devices
hash.secret=CHANGE_ME_NAO_USADO

# An ID of a record in userroles DB table representing an ORG_ADMIN role
# Do not change this!
role.orgadmin.id=2

# A path to a root directory for storing plugin files
plugins.files.directory=/usr/local/tomcat/work/plugins

# A path to a file to be created by the application initializer to signal on initialization completion
initialization.completion.signal.file=/usr/local/tomcat/work/initialized.txt

# A command for calling the aapt
aapt.command=aapt

# An URL for the file with configuration for loggers
log4j.config=file:///usr/local/tomcat/conf/log4j-hmdm.xml

# The parameters specific to Device Log plugin
plugin.devicelog.persistence.config.class=com.hmdm.plugins.devicelog.persistence.postgres.DeviceLogPostgresPersistenceConfiguration

# MQTT
mqtt.server.uri=localhost:31000
mqtt.auth=true
mqtt.external=0
mqtt.client.tag=
mqtt.message.delay=1000

# Fast device search by last characters, here's the length
device.fast.search.chars=5

# SMTP
smtp.host=localhost
smtp.port=25
smtp.ssl=0
smtp.starttls=0
smtp.username=
smtp.password=
smtp.from=noreply@example.com

# JWT Config secret and token validity
jwt.secretkey=CHANGE_ME_NAO_USADO
jwt.validity=86400
jwt.validityrememberme=2592000

# Proxy / IP forwarding (producao vem do .env: PROXY_ADDRESSES)
proxy.addresses=
proxy.ip.header=X-Forwarded-For
plugin.audit.display.forwarded.ip=1

# Photo plugin
plugin.photo.enable.places=0

# SQL init script
sql.init.script.path=/usr/local/tomcat/work/init.sql
